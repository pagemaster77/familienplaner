# Netlify veröffentlicht nur den Ordner "site" (die App). Kein Build nötig.
[build]
  publish = "site"
  # Spart Credits: nur neu veröffentlichen, wenn sich an der App (site/) oder an dieser Datei etwas geändert hat.
  # Änderungen an STAND.md, alexa/, supabase/ usw. lösen keine Veröffentlichung aus.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site netlify.toml"
