<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2b6cb0">
<meta property="og:title" content="🎁 Wunschliste">
<meta property="og:description" content="Schau, was sich jemand aus der Familie wünscht.">
<title>Wunschliste</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6fa;--card:#fff;--text:#1d2433;--muted:#6b7488;--line:#e3e7ef;--primary:#2b6cb0;--ok:#2f9e5b;--warn:#fff4d6}
@media (prefers-color-scheme:dark){:root{--bg:#10141c;--card:#1a202c;--text:#eef1f7;--muted:#9aa4b8;--line:#2b3447;--warn:#3a3217}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:24px;margin:6px 0 2px}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 14px}
.card h2{font-size:17px;margin:0 0 6px}
.warn{background:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin:0 0 14px}
.w{padding:10px 0;border-top:1px solid var(--line)}
.w:first-of-type{border-top:0}
.t{font-weight:600}
.n{color:var(--muted);font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
a.lnk{color:var(--primary);font-weight:600;text-decoration:none;font-size:14px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:9px 14px;background:var(--primary);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500;padding:6px 10px}
.done{color:var(--ok);font-weight:600;font-size:14px}
input{font:inherit;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.bought .t{opacity:.55;text-decoration:line-through}
.err{color:#d64545}
</style>
</head>
<body>
<main id="m"><p class="sub">Lade Wunschliste …</p></main>
<script>
const URL_ = "https://wpiqwoprnoasuckrdwlr.supabase.co", KEY = "sb_publishable_sJfG-ghkxhk192jMytLhKA_XfroLdyf";
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const OCC = [["Weihnachten", "🎄"], ["Geburtstag", "🎂"], ["Sonstiges", "🎁"]];
const $ = id => document.getElementById(id), m = $("m");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = u => { u = String(u || "").trim(); if (!u) return ""; if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = "https://" + u; return /^https?:\/\//i.test(u) ? u : ""; };
let name = ""; try { name = localStorage.getItem("wunsch_name") || ""; } catch (e) { /* egal */ }
async function rpc(fn, args) {
  const r = await fetch(`${URL_}/rest/v1/rpc/${fn}`, { method: "POST", headers: { apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json" }, body: JSON.stringify(args) });
  const t = await r.text(); let j = null; try { j = t ? JSON.parse(t) : null; } catch (e) { /* egal */ }
  if (!r.ok) throw new Error((j && j.message) || "Fehler");
  return j;
}
let data = null;
function show() {
  if (!data) { m.innerHTML = `<h1>Link nicht mehr gültig</h1><p class="sub">Diese Wunschliste wird nicht mehr geteilt. Frag bitte nach einem neuen Link.</p>`; return; }
  document.title = "Wunschliste von " + data.name;
  const list = data.wishes || [];
  m.innerHTML = `<h1>🎁 Wunschliste von ${esc(data.name)}</h1><p class="sub">${list.length} ${list.length === 1 ? "Wunsch" : "Wünsche"}</p>
    <div class="warn">🤫 Bist du selbst ${esc(data.name)}? Dann bitte nicht weiterlesen – hier steht, was schon besorgt ist. Überraschung!</div>
    <div class="card"><label for="nm" class="n">Dein Name (damit andere sehen, wer etwas besorgt)</label><input id="nm" maxlength="30" placeholder="z. B. Oma Inge" value="${esc(name)}"></div>
    ${OCC.map(([o, ic]) => { const l = list.filter(w => w.occasion === o); return l.length ? `<div class="card"><h2>${ic} ${o}</h2>${l.map(w => { const u = safeUrl(w.url);
      return `<div class="w ${w.bought ? "bought" : ""}"><div class="t">${esc(w.title)}${w.price ? ` <span class="n">· ${esc(w.price)}</span>` : ""}</div>${w.note ? `<div class="n">${esc(w.note)}</div>` : ""}
        <div class="row">${u ? `<a class="lnk" href="${esc(u)}" target="_blank" rel="noopener noreferrer">🔗 Zum Angebot</a>` : ""}
        ${w.bought ? `<span class="done">✔ schon besorgt${w.bought_by ? " von " + esc(w.bought_by) : ""}</span>${w.by_link ? `<button class="ghost" data-w="${esc(w.id)}" data-on="0">↺ Doch nicht</button>` : ""}` : `<button data-w="${esc(w.id)}" data-on="1">✔ Gekauft</button>`}</div></div>`; }).join("")}</div>` : ""; }).join("")}
    ${list.length ? "" : `<p class="sub">Noch keine Wünsche eingetragen.</p>`}
    <p class="n" style="text-align:center">Familienplaner</p>`;
  $("nm") && $("nm").addEventListener("input", e => { name = e.target.value; try { localStorage.setItem("wunsch_name", name); } catch (x) { /* egal */ } });
  m.querySelectorAll("button[data-w]").forEach(b => b.addEventListener("click", async () => {
    const on = b.dataset.on === "1";
    if (on && !name.trim()) { $("nm").focus(); $("nm").style.borderColor = "#d64545"; return; }
    b.disabled = true;
    try { await rpc("public_wish_mark", { p_token: TOKEN, p_wish: b.dataset.w, p_name: name, p_on: on }); await load(); }
    catch (e) { b.disabled = false; alert(e.message); }
  }));
}
async function load() { try { data = TOKEN ? await rpc("public_wishlist", { p_token: TOKEN }) : null; show(); } catch (e) { m.innerHTML = `<h1>Das hat nicht geklappt</h1><p class="sub err">${esc(e.message)}</p>`; } }
load();
</script>
</body>
</html>
