<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Spiele-Test</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap">
<style>
/* Layout: Titel, vier Spielkarten, darunter das aktive Spiel in voller Breite mit Anzeige oben und Bedienung unten. */
:root{--bg:#0d1020;--panel:#161a31;--panel-2:#1d2240;--line:#2b3160;--text:#eef0ff;--muted:#9aa1c9;--ac:#7c9cff;--head:"Space Grotesk",system-ui,sans-serif;--body:"Inter",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1200px 500px at 50% -10%,#1b2150 0,var(--bg) 60%) no-repeat,var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--head);font-size:30px;line-height:1.1;margin:0}
.sub{margin:6px 0 0;color:var(--muted);font-size:14px}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.menu button{font:inherit;text-align:left;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:11px 12px;cursor:pointer;min-width:0;border-left:4px solid var(--c)}
.menu button b{display:block;font-family:var(--head);font-size:16px;line-height:1.2}
.menu button span{font-size:12.5px;color:var(--muted)}
.menu button[aria-pressed=true]{background:var(--panel-2);border-color:var(--c)}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.game{display:flex;flex-direction:column;gap:10px}
.hud{display:flex;justify-content:space-between;align-items:center;font-family:var(--head);font-size:18px;padding:0 4px}
.hud b{font-weight:700;display:flex;align-items:center;gap:6px}
.cvw{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#000;box-shadow:0 10px 30px #0008;width:100%}
canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#080a1ccc;backdrop-filter:blur(3px);padding:16px}
.ov[hidden]{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center;max-width:300px}
.card h2{font-family:var(--head);margin:0 0 6px;font-size:24px}
.card p{margin:0 0 14px;color:var(--muted);font-size:14px}
.go{font:inherit;font-weight:600;background:var(--ac);color:#0b0f26;border:0;border-radius:12px;padding:12px 22px;font-size:16px;cursor:pointer}
.tools{display:flex;gap:8px;align-items:center;justify-content:space-between}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button,.mini,.big{font:inherit;color:var(--text);background:transparent;border:0;border-radius:9px;padding:9px 12px;cursor:pointer}
.seg button.on{background:var(--ac);color:#0b0f26;font-weight:600}
.mini{background:var(--panel);border:1px solid var(--line)}
.big{width:100%;background:var(--ac);color:#0b0f26;font-weight:600;font-size:17px;padding:14px;border-radius:14px}
.msg{margin:0;text-align:center;color:var(--muted);min-height:1.4em}
.dk,.lt{display:inline-block;width:16px;height:16px;border-radius:50%}
.dk{background:radial-gradient(circle at 35% 30%,#666,#050505 70%)}
.lt{background:radial-gradient(circle at 35% 30%,#fff,#bbb 75%)}
.howto{font-size:14px;color:var(--muted);margin:0}.howto b{color:var(--text)}
.note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <header><h1>Spiele-Test</h1><p class="sub">Vier Spiele zum Ausprobieren, per Finger oder Maus bedienbar. Nicht in der Familien-App oder Spielhalle eingebaut.</p></header>
  <nav class="menu" id="menu" aria-label="Spielauswahl"></nav>
  <section class="game" id="game"></section>
  <p class="howto" id="howto"></p>
  <p class="note">Bestwerte merkt sich dein Gerät. Alle Figuren sind selbst gezeichnet.</p>
</main>
<script>
"use strict";
const TAU = Math.PI * 2, clamp = (v, a, b) => Math.max(a, Math.min(b, v)), rnd = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.random() * a.length | 0];
const el = (t, c) => { const e = document.createElement(t); if (c) e.className = c; return e; };
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* egal */ } } };
function bestOf(key, score) { const b = Math.max(+store.get(key) || 0, score); store.set(key, b); return b; }
function rr(c, x, y, w, h, r) { c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h); }
function frame(update) { let id, last = performance.now(), dead = false; const f = t => { if (dead) return; const dt = Math.min(0.05, (t - last) / 1000); last = t; update(dt, t); id = requestAnimationFrame(f); }; id = requestAnimationFrame(f); return () => { dead = true; cancelAnimationFrame(id); }; }
function shell(box, w, h, tools) {
  box.innerHTML = `<div class="hud"><b id="hl"></b><b id="hr"></b></div><div class="cvw" style="aspect-ratio:${w}/${h}"><canvas></canvas><div class="ov" hidden></div></div>${tools || ""}`;
  const cv = box.querySelector("canvas"), dpr = Math.min(2, window.devicePixelRatio || 1); cv.width = w * dpr; cv.height = h * dpr;
  const c = cv.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0); const ov = box.querySelector(".ov");
  return { cv, c, w, h, box,
    pos: e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * w / r.width, y: (e.clientY - r.top) * h / r.height }; },
    hud: (a, b) => { box.querySelector("#hl").innerHTML = a; box.querySelector("#hr").innerHTML = b; },
    overlay: (t, p, btn, cb) => { ov.hidden = false; ov.innerHTML = `<div class="card"><h2>${t}</h2><p>${p}</p><button class="go" type="button">${btn}</button></div>`; ov.querySelector(".go").onclick = () => { ov.hidden = true; cb(); }; } };
}
function burst(list, x, y, color, n, speed) { for (let i = 0; i < n; i++) { const a = rnd(0, TAU), v = rnd(0.3, 1) * speed; list.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: rnd(0.4, 0.9), c: color, r: rnd(1.5, 3.5) }); } }
function stepParts(c, list, dt, g) { for (let i = list.length - 1; i >= 0; i--) { const p = list[i]; p.life += dt; if (p.life > p.max) { list.splice(i, 1); continue; } p.vy += (g || 0) * dt; p.x += p.vx * dt; p.y += p.vy * dt; c.globalAlpha = 1 - p.life / p.max; c.fillStyle = p.c; c.beginPath(); c.arc(p.x, p.y, p.r, 0, TAU); c.fill(); } c.globalAlpha = 1; }
function stepTexts(c, list, dt) { for (let i = list.length - 1; i >= 0; i--) { const t = list[i]; t.life += dt; if (t.life > 0.9) { list.splice(i, 1); continue; } c.globalAlpha = 1 - t.life / 0.9; c.fillStyle = t.c; c.font = "700 " + (t.s || 20) + "px Space Grotesk, system-ui, sans-serif"; c.textAlign = "center"; c.fillText(t.t, t.x, t.y - t.life * 40); } c.globalAlpha = 1; }

/* ================= Weltraum-Abwehr ================= */
function space(box) {
  const S = shell(box, 360, 560), c = S.c, W = 360, H = 560;
  const stars = Array.from({ length: 60 }, () => ({ x: rnd(0, W), y: rnd(0, H), z: rnd(0.3, 1) }));
  const COLS = ["#ff5d8f", "#ffb02e", "#4dd8ff", "#a78bfa", "#5eead4"], keys = {};
  const PU = { D: { t: "2x", c: "#5eead4", n: "Doppelschuss" }, F: { t: "F", c: "#a78bfa", n: "Fächerschuss" }, S: { t: "S", c: "#ffd166", n: "Schnellfeuer" }, L: { t: "L", c: "#ff7a59", n: "Durchschlag" }, O: { t: "O", c: "#4dd8ff", n: "Schutzschild" }, H: { t: "♥", c: "#ff5d8f", n: "Extraleben" }, Z: { t: "Z", c: "#c4b5fd", n: "Zeitlupe" }, B: { t: "B", c: "#ffffff", n: "Nova-Bombe" } };
  const POOL = "DDDFFFSSLLOOHZZB";
  let st, tx = W / 2, best = +store.get("arc_space") || 0;
  const onKey = v => e => { if (e.key === "ArrowLeft" || e.key === "a") keys.l = v; if (e.key === "ArrowRight" || e.key === "d") keys.r = v; if (e.key.startsWith("Arrow")) e.preventDefault(); };
  const kd = onKey(true), ku = onKey(false); addEventListener("keydown", kd); addEventListener("keyup", ku);
  function wave(n) { st.n = n; st.al = []; const rows = Math.min(5, 3 + Math.floor(n / 2)); for (let r = 0; r < rows; r++) for (let k = 0; k < 7; k++) st.al.push({ x: 36 + k * 44, y: 84 + r * 36, r, w: 28, h: 22, ph: rnd(0, 6) }); st.dir = 1; st.banner = 1.6; st.eb = []; }
  function fresh() { st = { mode: "play", t: 0, score: 0, lives: 3, inv: 0, ship: { x: W / 2, y: 506 }, b: [], eb: [], pu: [], wp: "single", wpT: 0, rapid: 0, pierce: 0, slow: 0, shield: false, flash: 0, fire: 0, sh: 1.2, ufo: null, ufoT: 14, parts: [], txt: [], shake: 0 }; tx = W / 2; wave(1); window.__st = () => st; }
  function over() { st.mode = "over"; best = bestOf("arc_space", st.score); S.overlay("Spiel vorbei", `Punkte: ${st.score}<br>Bestwert: ${best}`, "Nochmal", fresh); }
  S.cv.addEventListener("pointerdown", e => { S.cv.setPointerCapture(e.pointerId); tx = S.pos(e).x; });
  S.cv.addEventListener("pointermove", e => { if (e.buttons || e.pointerType === "mouse") tx = S.pos(e).x; });
  const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  function killAlien(i, noDrop) { const a = st.al.splice(i, 1)[0], pts = 10 + (4 - Math.min(4, a.r)) * 5; st.score += pts; burst(st.parts, a.x + 14, a.y + 11, COLS[a.r % 5], 14, 160); st.txt.push({ x: a.x + 14, y: a.y, t: "+" + pts, c: "#fff", life: 0, s: 14 }); if (!noDrop && Math.random() < 0.14) st.pu.push({ x: a.x + 14, y: a.y, k: POOL[Math.random() * POOL.length | 0] }); }
  function grab(k) {
    const sh = st.ship, p = PU[k]; st.txt.push({ x: sh.x, y: sh.y - 30, t: p.n, c: p.c, life: 0, s: 18 });
    if (k === "D" || k === "F") { st.wp = k === "D" ? "double" : "spread"; st.wpT = 12; } else if (k === "S") st.rapid = 10; else if (k === "L") st.pierce = 8; else if (k === "O") st.shield = true; else if (k === "Z") st.slow = 6;
    else if (k === "H") st.lives = Math.min(5, st.lives + 1);
    else if (k === "B") { st.flash = 0.3; st.eb = []; for (let i = st.al.length - 1; i >= 0; i--) if (Math.random() < 0.5) killAlien(i, true); }
  }
  function update(dt) {
    if (st.mode === "play") {
      st.t += dt; if (keys.l) tx -= 380 * dt; if (keys.r) tx += 380 * dt; tx = clamp(tx, 22, W - 22);
      const sh = st.ship, ts = st.slow > 0 ? 0.5 : 1; sh.x += clamp((tx - sh.x) * 14 * dt, -620 * dt, 620 * dt);
      st.fire -= dt;
      if (st.fire <= 0) { const pi = st.pierce > 0, y = sh.y - 18; if (st.wp === "double") st.b.push({ x: sh.x - 8, y, vx: 0, pi }, { x: sh.x + 8, y, vx: 0, pi }); else if (st.wp === "spread") st.b.push({ x: sh.x, y, vx: -95, pi }, { x: sh.x, y, vx: 0, pi }, { x: sh.x, y, vx: 95, pi }); else st.b.push({ x: sh.x, y, vx: 0, pi }); st.fire = st.rapid > 0 ? 0.11 : 0.25; }
      st.wpT = Math.max(0, st.wpT - dt); if (st.wpT === 0) st.wp = "single"; st.rapid = Math.max(0, st.rapid - dt); st.pierce = Math.max(0, st.pierce - dt); st.slow = Math.max(0, st.slow - dt);
      st.inv = Math.max(0, st.inv - dt); st.banner = Math.max(0, st.banner - dt); st.shake = Math.max(0, st.shake - dt); st.flash = Math.max(0, st.flash - dt);
      st.b.forEach(b => { b.y -= 640 * dt; b.x += b.vx * dt; }); st.b = st.b.filter(b => b.y > -20 && b.x > -10 && b.x < W + 10);
      const total = 7 * Math.min(5, 3 + Math.floor(st.n / 2)), sp = (32 + st.n * 7 + (1 - st.al.length / total) * 70) * ts;
      st.al.forEach(a => { a.x += st.dir * sp * dt; });
      if (st.al.some(a => a.x < 14 || a.x + a.w > W - 14)) { st.dir *= -1; st.al.forEach(a => { a.y += 14; a.x = clamp(a.x, 14, W - 14 - a.w); }); }
      if (st.al.some(a => a.y + a.h >= sh.y - 10)) { burst(st.parts, sh.x, sh.y, "#fff", 30, 220); over(); }
      st.sh -= dt * ts; if (st.sh <= 0 && st.al.length) { const bot = {}; st.al.forEach(a => { const k = Math.round(a.x / 44); if (!bot[k] || a.y > bot[k].y) bot[k] = a; }); const a = pick(Object.values(bot)); st.eb.push({ x: a.x + 12, y: a.y + 22, w: 5, h: 14 }); st.sh = Math.max(0.45, 1.3 - st.n * 0.1) * rnd(0.6, 1.1); }
      st.eb.forEach(b => { b.y += (200 + st.n * 12) * dt * ts; }); st.eb = st.eb.filter(b => b.y < H + 20);
      st.ufoT -= dt; if (st.ufoT <= 0 && !st.ufo) { st.ufo = { x: -40, w: 36, h: 16, y: 40 }; st.ufoT = 18; }
      if (st.ufo) { st.ufo.x += 100 * dt; if (st.ufo.x > W + 40) st.ufo = null; }
      st.b = st.b.filter(b => {
        const bb = { x: b.x - 2, y: b.y - 8, w: 4, h: 16 }; let alive = true;
        for (let i = st.al.length - 1; i >= 0; i--) if (hit(bb, st.al[i])) { killAlien(i); if (!b.pi) { alive = false; break; } }
        if (alive && st.ufo && hit(bb, { x: st.ufo.x, y: st.ufo.y, w: st.ufo.w, h: st.ufo.h })) { st.score += 100; st.txt.push({ x: st.ufo.x + 18, y: st.ufo.y, t: "+100", c: "#ffd166", life: 0, s: 22 }); burst(st.parts, st.ufo.x + 18, st.ufo.y + 8, "#ffd166", 24, 200); st.pu.push({ x: st.ufo.x + 18, y: st.ufo.y, k: pick(["D", "F", "S", "L", "O", "H", "B"]) }); st.ufo = null; if (!b.pi) alive = false; }
        return alive;
      });
      st.pu.forEach(p => { p.y += 90 * dt; }); st.pu = st.pu.filter(p => { if (Math.abs(p.x - sh.x) < 24 && Math.abs(p.y - sh.y) < 22) { grab(p.k); return false; } return p.y < H + 20; });
      const me = { x: sh.x - 14, y: sh.y - 10, w: 28, h: 22 };
      if (st.inv <= 0) { const k = st.eb.findIndex(b => hit(b, me)); if (k >= 0) { st.eb.splice(k, 1); if (st.shield) { st.shield = false; st.inv = 0.8; burst(st.parts, sh.x, sh.y, "#4dd8ff", 20, 200); } else { st.lives--; st.inv = 1.6; st.shake = 0.3; burst(st.parts, sh.x, sh.y, "#ff5d8f", 26, 220); if (st.lives <= 0) over(); } } }
      if (!st.al.length && st.mode === "play") { st.score += 100; wave(st.n + 1); }
    }
    draw(dt);
  }
  function chips() {
    const list = []; if (st.wpT > 0) list.push([st.wp === "double" ? "D" : "F", st.wpT, 12]); if (st.rapid > 0) list.push(["S", st.rapid, 10]); if (st.pierce > 0) list.push(["L", st.pierce, 8]); if (st.slow > 0) list.push(["Z", st.slow, 6]); if (st.shield) list.push(["O", 1, 1]);
    list.forEach(([k, v, m], i) => { const x = 8 + i * 40, p = PU[k]; c.fillStyle = "#0b0f26cc"; rr(c, x, 8, 36, 20, 8); c.fill(); c.fillStyle = p.c; rr(c, x + 3, 22, 30 * v / m, 3, 2); c.fill(); c.font = "700 11px Inter, sans-serif"; c.textAlign = "center"; c.fillText(p.t, x + 18, 19); });
  }
  function draw(dt) {
    c.save(); if (st.shake > 0) c.translate(rnd(-4, 4), rnd(-4, 4));
    const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#0a0b24"); g.addColorStop(1, st.slow > 0 ? "#2a2070" : "#1d1550"); c.fillStyle = g; c.fillRect(-10, -10, W + 20, H + 20);
    stars.forEach(s => { s.y += s.z * 40 * dt; if (s.y > H) { s.y = 0; s.x = rnd(0, W); } c.globalAlpha = s.z; c.fillStyle = "#fff"; c.fillRect(s.x, s.y, s.z * 2, s.z * 2); }); c.globalAlpha = 1;
    st.al.forEach(a => { const col = COLS[a.r % 5], bob = Math.sin(st.t * 6 + a.ph) * 2; c.shadowColor = col; c.shadowBlur = 10; c.fillStyle = col; rr(c, a.x, a.y + bob, a.w, a.h, 8); c.fill(); c.fillRect(a.x + 4, a.y + a.h - 2 + bob, 5, 5 + bob * 0.5); c.fillRect(a.x + a.w - 9, a.y + a.h - 2 + bob, 5, 5 - bob * 0.5); c.fillRect(a.x + 6, a.y - 4 + bob, 3, 5); c.fillRect(a.x + a.w - 9, a.y - 4 + bob, 3, 5); c.shadowBlur = 0; c.fillStyle = "#0b0f26"; c.beginPath(); c.arc(a.x + 9, a.y + 9 + bob, 3.2, 0, TAU); c.arc(a.x + a.w - 9, a.y + 9 + bob, 3.2, 0, TAU); c.fill(); });
    if (st.ufo) { const u = st.ufo; c.shadowColor = "#ffd166"; c.shadowBlur = 14; c.fillStyle = "#ffd166"; c.beginPath(); c.ellipse(u.x + 18, u.y + 9, 18, 7, 0, 0, TAU); c.fill(); c.fillStyle = "#fff3c4"; c.beginPath(); c.ellipse(u.x + 18, u.y + 4, 9, 6, 0, Math.PI, TAU); c.fill(); c.shadowBlur = 0; }
    st.b.forEach(b => { c.shadowColor = b.pi ? "#ff7a59" : "#5eead4"; c.shadowBlur = 10; c.fillStyle = b.pi ? "#ffb08a" : "#5eead4"; rr(c, b.x - 2, b.y - 8, 4, b.pi ? 20 : 16, 2); c.fill(); });
    c.shadowColor = "#ff5d8f"; c.fillStyle = "#ff8fb1"; st.eb.forEach(b => { rr(c, b.x, b.y, b.w, b.h, 2); c.fill(); }); c.shadowBlur = 0;
    st.pu.forEach(p => { const q = PU[p.k]; c.shadowColor = q.c; c.shadowBlur = 10; c.fillStyle = q.c; rr(c, p.x - 15, p.y - 9, 30, 18, 9); c.fill(); c.shadowBlur = 0; c.fillStyle = "#0b0f26"; c.font = "700 12px Inter, sans-serif"; c.textAlign = "center"; c.fillText(q.t, p.x, p.y + 4); });
    if (st.mode === "play" || (st.mode === "over" && st.lives > 0)) { const sh = st.ship; if (st.inv <= 0 || Math.floor(st.inv * 12) % 2) { c.shadowColor = "#7c9cff"; c.shadowBlur = 14; c.fillStyle = "#7c9cff"; c.beginPath(); c.moveTo(sh.x, sh.y - 20); c.lineTo(sh.x + 17, sh.y + 12); c.lineTo(sh.x + 6, sh.y + 7); c.lineTo(sh.x - 6, sh.y + 7); c.lineTo(sh.x - 17, sh.y + 12); c.closePath(); c.fill(); c.shadowBlur = 0; c.fillStyle = "#dbe4ff"; c.beginPath(); c.ellipse(sh.x, sh.y - 2, 3.5, 7, 0, 0, TAU); c.fill(); c.fillStyle = "#ffb02e"; c.beginPath(); c.moveTo(sh.x - 4, sh.y + 8); c.lineTo(sh.x, sh.y + 14 + Math.random() * 8); c.lineTo(sh.x + 4, sh.y + 8); c.fill(); }
      if (st.shield) { c.strokeStyle = "#4dd8ff"; c.lineWidth = 2.5; c.globalAlpha = 0.6 + Math.sin(st.t * 8) * 0.3; c.beginPath(); c.arc(sh.x, sh.y - 2, 26, 0, TAU); c.stroke(); c.globalAlpha = 1; } }
    stepParts(c, st.parts, dt, 0); stepTexts(c, st.txt, dt);
    if (st.flash > 0) { c.globalAlpha = st.flash / 0.3 * 0.7; c.fillStyle = "#fff"; c.fillRect(0, 0, W, H); c.globalAlpha = 1; }
    if (st.banner > 0) { c.globalAlpha = Math.min(1, st.banner); c.fillStyle = "#fff"; c.font = "700 30px Space Grotesk, system-ui, sans-serif"; c.textAlign = "center"; c.fillText("Welle " + st.n, W / 2, 300); c.globalAlpha = 1; }
    chips(); c.restore();
    S.hud(`Punkte ${st.score}`, `Welle ${st.n} <span style="color:#ff5d8f">${"♥".repeat(Math.max(0, st.lives))}</span>`);
  }
  fresh(); st.mode = "wait"; draw(0);
  S.overlay("Weltraum-Abwehr", "Ziehe den Finger nach links und rechts. Dein Schiff schießt von allein. Fange die Extras, die von abgeschossenen Aliens fallen.", "Los geht's", fresh);
  const stop = frame(update); return () => { stop(); removeEventListener("keydown", kd); removeEventListener("keyup", ku); };

/* ================= Ballon-Pfeil ================= */

    c.fillStyle = "#a45a2b"; c.beginPath(); c.ellipse(4, 2, 16, 9, 0, 0, TAU); c.fill();
    c.fillStyle = "#7a3f1d"; c.beginPath(); c.ellipse(16, -14, 9, 10, -0.3, 0, TAU); c.fill();
    c.fillStyle = "#e63946"; [0, 1, 2].forEach(i => { c.beginPath(); c.arc(11 + i * 4, -24 + (i === 1 ? -2 : 0), 3.2, 0, TAU); c.fill(); });
    c.beginPath(); c.arc(25, -8, 3, 0, TAU); c.fill();
    c.fillStyle = "#ffb703"; c.beginPath(); c.moveTo(23, -16); c.lineTo(33, -13); c.lineTo(23, -10); c.fill();
    c.fillStyle = "#fff"; c.beginPath(); c.arc(19, -16, 3, 0, TAU); c.fill(); c.fillStyle = "#111"; c.beginPath(); c.arc(20, -16, 1.5, 0, TAU); c.fill();
    c.save(); c.translate(-2, -8); c.rotate(-flap); c.fillStyle = "#5a2c12"; c.beginPath(); c.ellipse(-4, -6, 18, 8, -0.2, 0, TAU); c.fill(); c.restore();
    c.restore();
  }
  function update(dt, t) {
    t /= 1000;
    if (st.mode === "play") {
      st.clock += dt; st.t -= dt; st.msgT = Math.max(0, st.msgT - dt); aim.flash = Math.max(0, aim.flash - dt);
      if (st.rel > 0) { st.rel -= dt; if (st.rel <= 0) { st.rel = 0; st.ammo = 8; } }
      st.sp -= dt; if (st.sp <= 0 && st.ch.filter(o => !o.dead).length < 8) { spawn(); st.sp = rnd(0.35, 0.9); }
      st.ch.forEach(o => { if (o.dead) { o.vy += 700 * dt; o.y += o.vy * dt; o.rot += o.dir * 7 * dt; o.x += o.dir * 20 * dt; } else { o.x += o.dir * o.v * dt; if (!o.run) o.y = o.y0 + Math.sin(st.clock * 3 + o.ph) * o.amp; } });
      st.ch = st.ch.filter(o => o.dead ? o.y < H + 80 : o.x > -80 && o.x < W + 80);
      if (st.t <= 0) { st.t = 0; over(); }
    }
    draw(dt, t);
  }
  function draw(dt, t) {
    const g = c.createLinearGradient(0, 0, 0, 330); g.addColorStop(0, "#5aa9ff"); g.addColorStop(1, "#ffe1b8"); c.fillStyle = g; c.fillRect(0, 0, W, H);
    c.fillStyle = "#fff6c9"; c.beginPath(); c.arc(290, 70, 28, 0, TAU); c.fill();
    c.fillStyle = "#7d8fb8"; c.beginPath(); c.moveTo(0, 330); c.lineTo(60, 240); c.lineTo(120, 300); c.lineTo(200, 220); c.lineTo(280, 305); c.lineTo(340, 250); c.lineTo(360, 280); c.lineTo(360, 340); c.lineTo(0, 340); c.fill();
    const items = st.ch.map(o => ({ s: o.s, o })); let hi = 0;
    hills.forEach((h, i) => { c.fillStyle = h.col; c.beginPath(); c.moveTo(0, h.y + 10); for (let x = 0; x <= W; x += 20) c.lineTo(x, h.y - 6 * h.s + Math.sin(x * 0.03 + i) * 8 * h.s + 8); c.lineTo(W, H); c.lineTo(0, H); c.fill();
      items.filter(it => (i === hills.length - 1 || it.s <= h.s + 0.001) && it.s > (i ? hills[i - 1].s + 0.001 : 0)).sort((a, b) => a.s - b.s).forEach(it => chicken(it.o, t)); });
    stepParts(c, st.parts, dt, 200); stepTexts(c, st.txt, dt);
    for (let i = 0; i < 8; i++) { c.fillStyle = i < st.ammo ? "#ffd166" : "#ffffff33"; rr(c, 12 + i * 14, H - 30, 8, 18, 3); c.fill(); }
    if (st.rel > 0) { c.fillStyle = "#ffffff55"; rr(c, 12, H - 40, 106, 5, 3); c.fill(); c.fillStyle = "#ffd166"; rr(c, 12, H - 40, 106 * (1 - st.rel / 0.9), 5, 3); c.fill(); }
    if (st.msgT > 0 || (st.ammo === 0 && st.rel === 0 && st.mode === "play")) { c.fillStyle = "#fff"; c.font = "700 22px Space Grotesk, system-ui, sans-serif"; c.textAlign = "center"; c.fillText("Nachladen!", W / 2, H - 60); }
    if (aim.show || aim.flash > 0) { c.strokeStyle = aim.flash > 0 ? "#ff5d8f" : "#fff"; c.lineWidth = 2; c.beginPath(); c.arc(aim.x, aim.y, 14, 0, TAU); c.moveTo(aim.x - 20, aim.y); c.lineTo(aim.x - 6, aim.y); c.moveTo(aim.x + 6, aim.y); c.lineTo(aim.x + 20, aim.y); c.moveTo(aim.x, aim.y - 20); c.lineTo(aim.x, aim.y - 6); c.moveTo(aim.x, aim.y + 6); c.lineTo(aim.x, aim.y + 20); c.stroke(); }
    S.hud(`Zeit ${Math.ceil(st.t)}`, `Punkte ${st.score}`);
  }
  fresh(); st.mode = "wait"; draw(0, 0);
  S.overlay("Hühnerjagd", "Tippe die Hühner an. Kleine, weit entfernte zählen mehr. Du hast 8 Schuss, dann auf Nachladen tippen.", "Los geht's", fresh);
  const stop = frame(update); return () => { stop(); removeEventListener("keydown", kd); };
}

const GAMES = {

  "ballon": { name: "Ballon-Pfeil", desc: "Ballons zerteilen bis alle weg sind", c: "#ff5d8f", mount: balloons, how: "<b>Ballon-Pfeil:</b> Ziehe den Finger nach links und rechts, dein Männchen schießt von allein Pfeile nach oben. Jeder Treffer teilt einen Ballon in zwei kleinere, bis alle weg sind. Berührst du einen Ballon, verlierst du ein Leben. Extras: <b>2x</b> zwei Pfeile, <b>S</b> schnellerer Pfeil, <b>Z</b> Ballons eingefroren, <b>O</b> Schutzschild, <b>♥</b> Extraleben." },

  "huhn": { name: "Hühnerjagd", desc: "Hühner abschießen, 60 Sekunden", c: "#ffb02e", mount: huhn, how: "<b>Hühnerjagd:</b> Tippe auf die Hühner. Kleine weit hinten bringen 25 Punkte, große vorne 10. Nach 8 Schuss auf Nachladen tippen. Du hast 60 Sekunden." }
};
const menu = document.getElementById("menu"), gameEl = document.getElementById("game"), howto = document.getElementById("howto");
let stopFn = null;
Object.keys(GAMES).forEach(id => { const b = el("button"); b.type = "button"; b.dataset.id = id; b.style.setProperty("--c", GAMES[id].c); b.innerHTML = `<b>${GAMES[id].name}</b><span>${GAMES[id].desc}</span>`; b.onclick = () => openGame(id); menu.append(b); });
function openGame(id) {
  if (!GAMES[id]) id = "weltraum"; if (stopFn) stopFn(); gameEl.innerHTML = "";
  document.documentElement.style.setProperty("--ac", GAMES[id].c);
  stopFn = GAMES[id].mount(gameEl); howto.innerHTML = GAMES[id].how;
  menu.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.id === id));
  try { history.replaceState(null, "", "#" + id); } catch (e) { /* egal */ }
}
openGame((location.hash || "").slice(1));
